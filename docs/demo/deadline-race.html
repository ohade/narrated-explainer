<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; font-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Racing the deadline</title><style>body.nx-page{padding:24px;font-family:system-ui,sans-serif;}body.nx-page>h1{color:var(--nx-ink);}body.nx-page>p,body.nx-page>footer{color:var(--nx-ink-2);}body.nx-page>footer{margin-top:24px;}body.nx-page>footer a{color:var(--nx-info-fg);}</style></head><body class="nx nx-page"><h1>Racing the deadline</h1><p>An app gives a request 300 ms. The request first waits in a busy gateway, then fans out to two services. Compare what happens when the gateway ignores the deadline (Before) with what happens when it passes the remaining time on (After).</p><figure class="nx"></figure>
<style>/* Narrated Explainer player styles. Every selector starts with .nx; colours come only from the
   tone custom properties below. Hex literals appear only in the palette definition. */

/* Palette: light-dark(light, dark), resolved by color-scheme. Auto follows the operating system;
   the Theme control sets data-nx-theme on every .nx element the player owns. */
.nx {
  color-scheme: light dark;
  --nx-ink: light-dark(#1d1f23, #eceef1);
  --nx-ink-2: light-dark(#4a4f57, #b6bbc3);
  --nx-page: light-dark(#ffffff, #15171a);
  --nx-sunken: light-dark(#f1f2f4, #23262b);
  --nx-hairline: light-dark(#d6d9de, #373b42);
  --nx-edge: light-dark(#7c828c, #7a808a);
  --nx-info-fg: light-dark(#2f4c9c, #a3b9f6);
  --nx-info-bg: light-dark(#e4eafa, #1f2a48);
  --nx-ok-fg: light-dark(#1c6b45, #82d4a8);
  --nx-ok-bg: light-dark(#e0f2e8, #173427);
  --nx-warn-fg: light-dark(#8a5300, #f1c56f);
  --nx-warn-bg: light-dark(#fcefd6, #3a2b10);
  --nx-stop-fg: light-dark(#a3282a, #f39d9d);
  --nx-stop-bg: light-dark(#fbe5e5, #3e1c1d);
}
.nx[data-nx-theme="light"] { color-scheme: light; }
.nx[data-nx-theme="dark"] { color-scheme: dark; }

/* Derived tones: the neutral tones as fg/bg pairs, resolved against whichever palette applies. */
.nx {
  --nx-ink-fg: var(--nx-ink);
  --nx-ink-bg: var(--nx-sunken);
  --nx-ink-2-fg: var(--nx-ink-2);
  --nx-ink-2-bg: var(--nx-sunken);
  --nx-sunken-fg: var(--nx-edge);
  --nx-sunken-bg: var(--nx-sunken);
}

.nx {
  display: block;
  margin: 0;
  max-width: 100%;
  min-width: 0;
  overflow-x: clip;
  color: var(--nx-ink);
  background: var(--nx-page);
  font-size: 18px;
  line-height: 1.45;
}
.nx *, .nx *::before, .nx *::after { box-sizing: border-box; }
.nx:focus { outline: none; }
.nx:fullscreen { overflow-y: auto; padding: 16px 24px; }
.nx::backdrop { background: var(--nx-page); }

/* Sticky controls; a page with its own sticky header sets --nx-sticky-top. */
.nx .nx-bar {
  position: sticky;
  top: var(--nx-sticky-top, 0px);
  z-index: 3;
  padding: 8px 0;
  background: var(--nx-page);
  border-bottom: 1px solid var(--nx-hairline);
}
.nx .nx-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.nx .nx-group { display: inline-flex; flex-wrap: wrap; }

.nx button {
  font: inherit;
  font-size: 18px;
  line-height: 1.2;
  min-height: 44px;
  min-width: 44px;
  padding: 8px 14px;
  color: var(--nx-ink);
  background: var(--nx-sunken);
  border: 1px solid var(--nx-edge);
  border-radius: 6px;
  cursor: pointer;
}
.nx button[hidden], .nx .nx-voice-name[hidden] { display: none; }
.nx button[aria-pressed="true"] {
  color: var(--nx-info-fg);
  background: var(--nx-info-bg);
  border-color: var(--nx-info-fg);
  font-weight: 700;
}
.nx button:focus-visible { outline: 3px solid var(--nx-info-fg); outline-offset: 2px; position: relative; z-index: 1; }
.nx .nx-group button { border-radius: 0; }
.nx .nx-group button:first-child { border-radius: 6px 0 0 6px; }
.nx .nx-group button:last-child { border-radius: 0 6px 6px 0; }
.nx .nx-group button + button { border-left-width: 0; }
.nx .nx-voice-name { font-size: 16px; color: var(--nx-ink-2); }

/* Progress: one clickable marker per position. */
.nx .nx-progress { display: flex; gap: 3px; margin-top: 8px; min-width: 0; }
.nx .nx-progress .nx-marker {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 0;
}
.nx .nx-progress .nx-marker::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 8px;
  margin-top: -4px;
  border-radius: 4px;
  background: var(--nx-hairline);
}
.nx .nx-progress .nx-marker-intro::before { background: var(--nx-sunken); border: 1px solid var(--nx-hairline); }
.nx .nx-progress .nx-marker.nx-passed::before { background: var(--nx-info-fg); border-color: var(--nx-info-fg); }
.nx .nx-progress .nx-marker[aria-current="step"]::before { height: 16px; margin-top: -8px; }

/* The player sets max-width so the bar, stage and caption fit the window; auto margins centre it. */
.nx .nx-stage { margin: 12px auto 0; min-width: 0; }
.nx .nx-stage svg { display: block; width: 100%; max-width: 100%; height: auto; }

.nx .nx-caption { margin: 12px 0 0; min-height: 3em; font-size: 22px; line-height: 1.45; color: var(--nx-ink); }
.nx .nx-word { border-radius: 4px; transition: background-color 120ms ease; }
.nx .nx-word-on { color: var(--nx-info-fg); background: var(--nx-info-bg); }

.nx .nx-transcript { margin: 12px 0 0; }
.nx .nx-transcript[hidden] { display: none; }
.nx .nx-transcript ol { margin: 0; padding: 0 0 0 1.6em; }
.nx .nx-transcript li { margin: 4px 0; }
.nx .nx-transcript .nx-transcript-item {
  width: 100%;
  text-align: start;
  background: transparent;
  border-color: transparent;
  font-weight: 400;
}
.nx .nx-transcript .nx-transcript-item[aria-current="step"] { background: var(--nx-info-bg); color: var(--nx-info-fg); }

@media (max-width: 600px) {
  .nx button { padding: 8px 10px; }
  .nx .nx-caption { font-size: 20px; }
}

@media (prefers-reduced-motion: reduce) {
  .nx .nx-word { transition: none; }
}

/* SVG utility classes for scenes and the kit. */
.nx .nx-fill-ink-fg { fill: var(--nx-ink-fg); }
.nx .nx-fill-ink-bg { fill: var(--nx-ink-bg); }
.nx .nx-stroke-ink { stroke: var(--nx-ink-fg); }
.nx .nx-fill-ink-2-fg { fill: var(--nx-ink-2-fg); }
.nx .nx-fill-ink-2-bg { fill: var(--nx-ink-2-bg); }
.nx .nx-stroke-ink-2 { stroke: var(--nx-ink-2-fg); }
.nx .nx-fill-info-fg { fill: var(--nx-info-fg); }
.nx .nx-fill-info-bg { fill: var(--nx-info-bg); }
.nx .nx-stroke-info { stroke: var(--nx-info-fg); }
.nx .nx-fill-ok-fg { fill: var(--nx-ok-fg); }
.nx .nx-fill-ok-bg { fill: var(--nx-ok-bg); }
.nx .nx-stroke-ok { stroke: var(--nx-ok-fg); }
.nx .nx-fill-warn-fg { fill: var(--nx-warn-fg); }
.nx .nx-fill-warn-bg { fill: var(--nx-warn-bg); }
.nx .nx-stroke-warn { stroke: var(--nx-warn-fg); }
.nx .nx-fill-stop-fg { fill: var(--nx-stop-fg); }
.nx .nx-fill-stop-bg { fill: var(--nx-stop-bg); }
.nx .nx-stroke-stop { stroke: var(--nx-stop-fg); }
.nx .nx-fill-sunken-fg { fill: var(--nx-sunken-fg); }
.nx .nx-fill-sunken-bg { fill: var(--nx-sunken-bg); }
.nx .nx-stroke-sunken { stroke: var(--nx-sunken-fg); }
.nx .nx-fill-page { fill: var(--nx-page); }
.nx .nx-stroke-page { stroke: var(--nx-page); }
.nx .nx-fill-edge { fill: var(--nx-edge); }
.nx .nx-stroke-edge { stroke: var(--nx-edge); }
.nx .nx-fill-hairline { fill: var(--nx-hairline); }
.nx .nx-stroke-hairline { stroke: var(--nx-hairline); }
.nx .nx-halo { paint-order: stroke; stroke: var(--nx-page); stroke-width: 6px; stroke-linejoin: round; }
</style>

<script>// Narrated Explainer drawing kit: pure helpers plus small SVG builders that return handles.
// A scene builds its drawing once with these builders, then its draw(state, ctx) only calls the
// handles' setters, which change attributes. The kit keeps no clock and starts no timers: every
// motion comes from the 0..1 progress values the scene passes in. Colours come only from the
// tone classes in player.css, never from literal colour values.
(function (root) {
  'use strict';

  const NX = root.NarratedExplainer || (root.NarratedExplainer = {});
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const ACCENTS = ['info', 'ok', 'warn', 'stop'];

  // ---- Pure helpers (no DOM; usable in Node) ----

  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const lerp = (a, b, p) => a + (b - a) * p;
  const ramp = (t, from, to) => (to === from ? (t >= to ? 1 : 0) : clamp01((t - from) / (to - from)));

  // The point at fraction p of the polyline's total length.
  function along(points, p) {
    const lengths = points.slice(1).map((pt, i) => Math.hypot(pt[0] - points[i][0], pt[1] - points[i][1]));
    let rest = clamp01(p) * lengths.reduce((a, b) => a + b, 0);
    for (let i = 0; i < lengths.length; i += 1) {
      if (rest <= lengths[i] || i === lengths.length - 1) {
        const f = lengths[i] === 0 ? 1 : Math.min(1, rest / lengths[i]);
        return [lerp(points[i][0], points[i + 1][0], f), lerp(points[i][1], points[i + 1][1], f)];
      }
      rest -= lengths[i];
    }
    return [points[0][0], points[0][1]];
  }

  const BACK = 1.70158;
  const ease = {
    in: (p) => Math.pow(clamp01(p), 3),
    out: (p) => 1 - Math.pow(1 - clamp01(p), 3),
    inOut: (p) => 0.5 - Math.cos(Math.PI * clamp01(p)) / 2,
    outBack: (p) => {
      const q = clamp01(p) - 1;
      return 1 + (BACK + 1) * q * q * q + BACK * q * q;
    },
  };

  // ---- Tones ----
  // A fill tone is an accent (info, ok, warn, stop: its strong -fg colour), an explicit
  // '<tone>-fg' or '<tone>-bg', or a neutral: ink and ink-2 (strong), sunken (soft), page.
  // Each maps to a class player.css defines: ink -> nx-fill-ink-fg, sunken -> nx-fill-sunken-bg.

  const NEUTRAL_FILL = { ink: 'ink-fg', 'ink-2': 'ink-2-fg', sunken: 'sunken-bg' };
  const solid = (tone) => (ACCENTS.includes(tone) ? tone + '-fg' : NEUTRAL_FILL[tone] || tone);
  const fillClass = (tone) => 'nx-fill-' + solid(tone);
  const strokeClass = (tone) => 'nx-stroke-' + String(tone).replace(/-fg$/, '');
  // Page colour reads on strong fills, ink on soft ones.
  const readableOn = (fill) => (/-fg$/.test(solid(fill)) ? 'page' : 'ink');
  const textClass = (tone, on, halo) => fillClass(on ? readableOn(on) : tone) + (halo ? ' nx-halo' : '');

  // ---- DOM ----

  const num = (n) => Math.round(n * 1e4) / 1e4;
  const pt = (p) => num(p[0]) + ' ' + num(p[1]);
  const withDefaults = (opts, base) => {
    const out = Object.assign({}, base);
    Object.keys(opts || {}).forEach((key) => { if (opts[key] != null) out[key] = opts[key]; });
    return out;
  };

  function attrs(node, values) {
    Object.keys(values).forEach((key) => {
      const v = values[key];
      if (v != null) node.setAttribute(key, typeof v === 'number' ? num(v) : v);
    });
    return node;
  }

  function el(parent, tag, values) {
    const node = root.document.createElementNS(SVG_NS, tag);
    attrs(node, values || {});
    parent.appendChild(node);
    return node;
  }

  const show = (node, on) => node.setAttribute('visibility', on ? 'visible' : 'hidden');
  const scaleAbout = (c, s) => 'translate(' + pt(c) + ') scale(' + num(s) + ') translate(' + pt([-c[0], -c[1]]) + ')';
  // Approximate width of a label at 18 units, since nodes are not measured.
  const labelWidth = (s) => String(s).length * 10.5 + 24;
  const withUnit = (value, unit) => num(value) + (unit ? ' ' + unit : '');

  function svg(stage, viewBox, label) {
    return el(stage, 'svg', {
      viewBox, role: 'img', 'aria-label': label, class: 'nx-svg',
      style: 'display: block; width: 100%; height: auto',
    });
  }

  function text(parent, x, y, str, opts) {
    const o = withDefaults(opts, { size: 20, weight: 400, anchor: 'start', tone: 'ink', on: null, halo: false });
    const node = el(parent, 'text', {
      x, y, 'font-size': o.size, 'font-weight': o.weight, 'text-anchor': o.anchor,
      class: textClass(o.tone, o.on, o.halo),
    });
    node.textContent = str;
    return node;
  }

  // ---- Builders ----

  function box(parent, opts) {
    const o = withDefaults(opts, { label: '', sub: '', tone: null });
    const { x, y, w, h } = o;
    const g = el(parent, 'g', { 'data-part': 'box' });
    const rect = el(g, 'rect', { x, y, width: w, height: h, rx: 12, 'stroke-width': 2 });
    if (o.label) text(g, x + w / 2, y + 34, o.label, { size: 22, weight: 600, anchor: 'middle' });
    if (o.sub) text(g, x + w / 2, y + 60, o.sub, { size: 18, anchor: 'middle', tone: 'ink-2' });
    const status = text(g, x + w / 2, y + h - 18, '', { size: 18, weight: 600, anchor: 'middle' });
    attrs(status, { 'data-part': 'status', visibility: 'hidden' });
    function setTone(tone) {
      const fill = ACCENTS.includes(tone) ? tone + '-bg' : tone === 'sunken' ? 'sunken' : 'page';
      rect.setAttribute('class', fillClass(fill) + ' ' + strokeClass(tone || 'edge'));
    }
    setTone(o.tone);
    const edges = { left: (f) => [x, y + h * f], right: (f) => [x + w, y + h * f],
      top: (f) => [x + w * f, y], bottom: (f) => [x + w * f, y + h] };
    return {
      g,
      center: [x + w / 2, y + h / 2],
      edge: (side, f) => edges[side](f == null ? 0.5 : f),
      setTone,
      setStatus(str, tone) {
        status.textContent = str || '';
        status.setAttribute('class', textClass(tone || 'ink', null, false));
        show(status, Boolean(str));
      },
    };
  }

  function arrow(parent, opts) {
    const o = withDefaults(opts, { label: '', tone: 'ink', dashed: false, head: true });
    const [from, to] = [o.from, o.to];
    const len = Math.hypot(to[0] - from[0], to[1] - from[1]);
    const angle = (Math.atan2(to[1] - from[1], to[0] - from[0]) * 180) / Math.PI;
    const g = el(parent, 'g', { 'data-part': 'arrow' });
    const line = el(g, 'line', { x1: from[0], y1: from[1], x2: to[0], y2: to[1], 'stroke-width': 2.5, 'data-part': 'arrow-line' });
    const head = o.head ? el(g, 'path', { d: 'M0 0 L-14 -7 L-14 7 Z', 'data-part': 'arrow-head' }) : null;
    // The label sits beside the middle of the line, on its left-hand normal (above a rightward line).
    const nx = len ? (to[1] - from[1]) / len : 0;
    const ny = len ? -(to[0] - from[0]) / len : -1;
    const side = Math.abs(nx) > 0.5 ? (nx > 0 ? 'start' : 'end') : 'middle';
    const label = text(g, (from[0] + to[0]) / 2 + nx * 14, (from[1] + to[1]) / 2 + ny * 14 + (side === 'middle' ? 0 : 6),
      o.label, { size: 18, anchor: side, tone: 'ink-2', halo: true });
    label.setAttribute('data-part', 'arrow-label');
    let dashed = o.dashed;
    let progress = 1;

    // Dashes up to the shown length, then one gap as long as the line.
    function dashesUpTo(shown) {
      const out = [];
      for (let at = 0; at < shown; at += 14) out.push(num(Math.min(8, shown - at)), 6);
      out[out.length - 1] = len;
      return out.join(' ');
    }
    function apply() {
      const shown = len * progress;
      if (dashed) {
        line.setAttribute('stroke-dasharray', progress >= 1 ? '8 6' : progress <= 0 ? '0 ' + num(len) : dashesUpTo(shown));
        line.setAttribute('stroke-dashoffset', 0);
      } else {
        line.setAttribute('stroke-dasharray', num(len) + ' ' + num(len));
        line.setAttribute('stroke-dashoffset', num(len - shown));
      }
      show(label, progress > 0);
      if (!head) return;
      show(head, progress > 0);
      const tip = along([from, to], progress);
      head.setAttribute('transform', 'translate(' + pt(tip) + ') rotate(' + num(angle) + ') scale(' + num(Math.min(1, shown / 16)) + ')');
    }
    function setTone(tone) {
      line.setAttribute('class', strokeClass(tone));
      if (head) head.setAttribute('class', fillClass(tone));
    }
    setTone(o.tone);
    apply();
    return {
      show: (on) => show(g, on),
      setTone,
      setDashed(on) { dashed = Boolean(on); apply(); },
      draw(p) { progress = clamp01(p); apply(); },
      setLabel(str) { label.textContent = str; },
    };
  }

  function token(parent, opts) {
    const o = withDefaults(opts, { label: '', tone: 'info' });
    const g = el(parent, 'g', { 'data-part': 'token', transform: 'translate(0 0)' });
    const rect = el(g, 'rect', { y: -17, height: 34, rx: 8 });
    const label = text(g, 0, 6, '', { size: 18, weight: 600, anchor: 'middle' });
    function setLabel(str) {
      const w = Math.max(34, labelWidth(str));
      label.textContent = str;
      attrs(rect, { x: -w / 2, width: w });
    }
    function setTone(tone) {
      rect.setAttribute('class', fillClass(tone));
      label.setAttribute('class', textClass(null, tone, false));
    }
    setLabel(o.label);
    setTone(o.tone);
    return {
      moveTo: (xy) => g.setAttribute('transform', 'translate(' + pt(xy) + ')'),
      show: (on) => show(g, on),
      setTone,
      setLabel,
    };
  }

  function bubble(parent, opts) {
    const o = withDefaults(opts, { text: '', h: 44 });
    const { x, y, w, h } = o;
    const tip = o.tail || [x + w / 2, y + h + 24];
    const g = el(parent, 'g', { 'data-part': 'bubble' });
    el(g, 'rect', { x, y, width: w, height: h, rx: 10, class: 'nx-fill-sunken-bg nx-stroke-edge', 'stroke-width': 2 });
    // The tail starts just inside the side facing its tip, so its fill covers the body's border there.
    const awayFromCorners = (lo, hi, v) => Math.max(lo + 18, Math.min(hi - 18, v));
    let base;
    if (tip[1] > y + h) base = [[awayFromCorners(x, x + w, tip[0]) - 10, y + h - 1], [awayFromCorners(x, x + w, tip[0]) + 10, y + h - 1]];
    else if (tip[1] < y) base = [[awayFromCorners(x, x + w, tip[0]) - 10, y + 1], [awayFromCorners(x, x + w, tip[0]) + 10, y + 1]];
    else {
      const ex = tip[0] < x ? x + 1 : x + w - 1;
      base = [[ex, awayFromCorners(y, y + h, tip[1]) - 10], [ex, awayFromCorners(y, y + h, tip[1]) + 10]];
    }
    el(g, 'path', { d: 'M' + pt(base[0]) + ' L' + pt(tip) + ' L' + pt(base[1]), class: 'nx-fill-sunken-bg nx-stroke-edge',
      'stroke-width': 2, 'stroke-linejoin': 'round' });
    const label = text(g, x + w / 2, y + h / 2 + 6, o.text, { size: 18, weight: 700, anchor: 'middle', on: 'sunken' });
    // Scales about the tail tip with an ease-out, so it grows out of what it points at.
    const pop = (p) => g.setAttribute('transform', scaleAbout(tip, ease.out(p)));
    pop(1);
    return { show: (on) => show(g, on), pop, setText: (str) => { label.textContent = str; } };
  }

  function queue(parent, opts) {
    const o = withDefaults(opts, { slots: 4, slotW: 64, gap: 8, h: 56, title: '' });
    const g = el(parent, 'g', { 'data-part': 'queue' });
    if (o.title) text(g, o.x, o.y - 12, o.title, { size: 18, tone: 'ink-2' });
    const chips = [];
    for (let i = 0; i < o.slots; i += 1) {
      const sx = o.x + i * (o.slotW + o.gap);
      el(g, 'rect', { x: sx, y: o.y, width: o.slotW, height: o.h, rx: 6, fill: 'none', class: 'nx-stroke-hairline', 'stroke-width': 2 });
      const chip = el(g, 'g', { 'data-part': 'chip', 'data-slot': i, transform: 'translate(' + pt([sx, o.y]) + ')', visibility: 'hidden' });
      const rect = el(chip, 'rect', { x: 3, y: 3, width: o.slotW - 6, height: o.h - 6, rx: 4 });
      const label = text(chip, o.slotW / 2, o.h / 2 + 6, '', { size: 18, weight: 600, anchor: 'middle' });
      label.setAttribute('data-part', 'chip-label');
      chips.push({ chip, rect, label });
    }
    return {
      set(items) {
        chips.forEach((c, i) => {
          const item = items[i];
          show(c.chip, Boolean(item));
          if (!item) return;
          const tone = item.tone || 'ink-2';
          c.label.textContent = item.label || '';
          c.rect.setAttribute('class', fillClass(tone));
          c.label.setAttribute('class', textClass(null, tone, false));
        });
      },
    };
  }

  function readout(parent, opts) {
    const o = withDefaults(opts, { size: 34, anchor: 'start' });
    const node = text(parent, o.x, o.y, '', { size: o.size, weight: 700, anchor: o.anchor, halo: true });
    node.setAttribute('data-part', 'readout');
    return {
      set(str, tone) {
        node.textContent = str;
        node.setAttribute('class', textClass(tone || 'ink', null, true));
      },
    };
  }

  // A friendly figure, drawn around the point between its feet, facing left. Its arm is two
  // segments from the shoulder with the elbow bent downward, the way an arm hangs.
  const SHOULDER = [-11, -111];
  const UPPER_ARM = 32;
  const FOREARM = 28;

  function drawFigure(g, tone, prefix) {
    const limb = (d, w) => el(g, 'path', { d, fill: 'none', class: 'nx-stroke-ink-2', 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    limb('M-5 -64 L-7 -32 L-8 -4', 7);
    limb('M5 -64 L7 -32 L8 -4', 7);
    el(g, 'ellipse', { cx: -13, cy: 0, rx: 7, ry: 3.5, class: 'nx-fill-ink-fg' });
    el(g, 'ellipse', { cx: 13, cy: 0, rx: 7, ry: 3.5, class: 'nx-fill-ink-fg' });
    el(g, 'line', { x1: 11, y1: -111, x2: 19, y2: -86, class: strokeClass(tone), 'stroke-width': 7, 'stroke-linecap': 'round' });
    el(g, 'line', { x1: 19, y1: -86, x2: 14, y2: -65, class: strokeClass(tone), 'stroke-width': 6, 'stroke-linecap': 'round' });
    el(g, 'rect', { x: -3, y: -121, width: 6, height: 7, class: 'nx-fill-warn-bg' });
    el(g, 'path', { d: 'M-15 -108 Q-15 -116 -7 -116 L7 -116 Q15 -116 15 -108 L10 -61 L-10 -61 Z', class: fillClass(tone) });
    el(g, 'circle', { cx: 14, cy: -62, r: 4.5, class: 'nx-fill-warn-bg nx-stroke-ink', 'stroke-width': 1.5 });
    el(g, 'circle', { cx: 0, cy: -129, r: 10, class: 'nx-fill-warn-bg nx-stroke-ink', 'stroke-width': 2 });
    el(g, 'circle', { cx: -5, cy: -130, r: 1.6, class: 'nx-fill-ink-fg' });
    el(g, 'circle', { cx: 1.5, cy: -130, r: 1.6, class: 'nx-fill-ink-fg' });
    el(g, 'path', { d: 'M-6 -125 Q-2.5 -122 1 -125', fill: 'none', class: 'nx-stroke-ink', 'stroke-width': 1.5, 'stroke-linecap': 'round' });
    const upper = el(g, 'line', { x1: SHOULDER[0], y1: SHOULDER[1], class: strokeClass(tone), 'stroke-width': 7, 'stroke-linecap': 'round', 'data-part': prefix + '-upper-arm' });
    const fore = el(g, 'line', { class: strokeClass(tone), 'stroke-width': 6, 'stroke-linecap': 'round', 'data-part': prefix + '-forearm' });
    const hand = el(g, 'circle', { r: 5, class: 'nx-fill-warn-bg nx-stroke-ink', 'stroke-width': 1.5, 'data-part': prefix + '-hand-tip' });
    // Moves the hand to target (figure coordinates); bend wobbles the elbow, in radians.
    return function armTo(target, bend) {
      const dx = target[0] - SHOULDER[0];
      const dy = target[1] - SHOULDER[1];
      const reach = Math.max(FOREARM - UPPER_ARM + 0.5, Math.min(UPPER_ARM + FOREARM - 0.5, Math.hypot(dx, dy)));
      const cos = (UPPER_ARM * UPPER_ARM + reach * reach - FOREARM * FOREARM) / (2 * UPPER_ARM * reach);
      const base = Math.atan2(dy, dx);
      const offset = Math.acos(Math.max(-1, Math.min(1, cos)));
      const elbowY = (a) => SHOULDER[1] + UPPER_ARM * Math.sin(a);
      const a = (elbowY(base - offset) >= elbowY(base + offset) ? base - offset : base + offset) + (bend || 0);
      const elbow = [SHOULDER[0] + UPPER_ARM * Math.cos(a), SHOULDER[1] + UPPER_ARM * Math.sin(a)];
      const toward = Math.atan2(target[1] - elbow[1], target[0] - elbow[0]);
      const tip = [elbow[0] + FOREARM * Math.cos(toward), elbow[1] + FOREARM * Math.sin(toward)];
      attrs(upper, { x2: elbow[0], y2: elbow[1] });
      attrs(fore, { x1: elbow[0], y1: elbow[1], x2: tip[0], y2: tip[1] });
      attrs(hand, { cx: tip[0], cy: tip[1] });
    };
  }

  function figure(parent, opts) {
    const o = withDefaults(opts, { scale: 1, tone: 'info' });
    const g = el(parent, 'g', { 'data-part': 'figure', transform: 'translate(' + pt([o.x, o.y]) + ') scale(' + num(o.scale) + ')' });
    const armTo = drawFigure(g, o.tone, 'fig');
    armTo([SHOULDER[0] - 4, SHOULDER[1] + 52], 0);
    return {
      reach: (xy) => armTo([(xy[0] - o.x) / o.scale, (xy[1] - o.y) / o.scale], 0),
      wave: (p) => armTo([SHOULDER[0] - 22 + 12 * Math.sin(4 * Math.PI * clamp01(p)), SHOULDER[1] - 42], 0),
    };
  }

  // The stopwatch is drawn at radius 56 around (0, 0) and scaled to r. The dial sweeps 300 degrees
  // clockwise from twelve o'clock for 0..max, leaving a gap under the crown like a kitchen timer.
  const SWEEP = 300;
  const ARC_R = 39;
  const HAND_R = 34;
  const OPERATOR_AT = [75, 51]; // the operator's feet, beside the dial
  const CROWN_Y = -78;
  const CROWN_AXIS = [0, -71];
  const CROWN_GRIP = [20, -71]; // the hand holds the crown's end while winding
  const CROWN_TOP = [14, -83]; // and rests on its top after pressing it
  const WRIST_ARC = 0.22;
  const PRESS_DEPTH = 4;
  const KNURL_X = [-8, 0, 8];
  const KNURL_PITCH = 8;
  const dialPoint = (deg, r) => [r * Math.sin((deg * Math.PI) / 180), -r * Math.cos((deg * Math.PI) / 180)];
  const bounce = (q) => 1 + 0.06 * Math.sin(2 * Math.PI * q) * (1 - q);

  function stopwatch(parent, opts) {
    const o = withDefaults(opts, { r: 56, max: 60, segments: null, operator: false, unit: '' });
    const segments = o.segments || [{ to: o.max, tone: 'info' }];
    const deg = (v) => (Math.max(0, Math.min(o.max, v)) / o.max) * SWEEP;
    const arcD = (fromDeg, toDeg) => 'M' + pt(dialPoint(fromDeg, ARC_R)) + ' A' + ARC_R + ' ' + ARC_R + ' 0 '
      + (toDeg - fromDeg > 180 ? 1 : 0) + ' 1 ' + pt(dialPoint(toDeg, ARC_R));
    const outer = el(parent, 'g', { 'data-part': 'stopwatch', transform: 'translate(' + pt([o.cx, o.cy]) + ') scale(' + num(o.r / 56) + ')' });
    el(outer, 'ellipse', { cx: 4, cy: 57, rx: 52, ry: 4, class: 'nx-fill-ink-fg', opacity: 0.12 });
    el(outer, 'circle', { cx: 3, cy: 4, r: 56, class: 'nx-fill-ink-fg', opacity: 0.12 });
    if (o.operator) el(outer, 'ellipse', { cx: 75, cy: 56, rx: 26, ry: 3, class: 'nx-fill-ink-fg', opacity: 0.12 });
    const dial = el(outer, 'g', { 'data-part': 'sw-dial' });
    const stem = el(dial, 'rect', { x: -6, y: CROWN_Y + 13, width: 12, height: 11, rx: 2, class: 'nx-fill-ink-2-fg' });
    const crown = el(dial, 'rect', { x: -15, y: CROWN_Y, width: 30, height: 14, rx: 4, class: 'nx-fill-ink-2-fg' });
    const knurls = KNURL_X.map((x) => el(dial, 'line', { x1: x, y1: CROWN_Y + 3, x2: x, y2: CROWN_Y + 11, class: 'nx-stroke-page', 'stroke-width': 2 }));
    const rim = el(dial, 'circle', { r: 56, 'data-part': 'sw-rim' });
    el(dial, 'circle', { r: 50, class: 'nx-fill-sunken-bg' });
    const flash = el(dial, 'circle', { r: 50, class: 'nx-fill-stop-bg', opacity: 0, 'data-part': 'sw-flash' });
    el(dial, 'path', { d: 'M-10 -49 A50 50 0 0 0 -48 -16', fill: 'none', class: 'nx-stroke-page', opacity: 0.35, 'stroke-width': 3, 'stroke-linecap': 'round' });
    for (let i = 0; i <= 6; i += 1) {
      const [a, b] = [dialPoint((i * SWEEP) / 6, 44), dialPoint((i * SWEEP) / 6, 49)];
      el(dial, 'line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: 'nx-stroke-ink', 'stroke-width': 3, 'stroke-linecap': 'round' });
    }
    el(dial, 'path', { d: arcD(0, SWEEP), fill: 'none', class: 'nx-stroke-hairline', 'stroke-width': 7 });
    const arcs = segments.map((s, i) => el(dial, 'path', { fill: 'none', class: strokeClass(s.tone || 'info'), 'stroke-width': 7, 'data-part': 'sw-arc-' + i }));
    const hand = el(dial, 'line', { x1: 0, y1: 0, class: 'nx-stroke-ink', 'stroke-width': 3, 'stroke-linecap': 'round', 'data-part': 'sw-hand' });
    el(dial, 'circle', { r: 5, class: 'nx-fill-ink-fg' });
    // Drawn over the hand with a halo, so the hand never hides it.
    const total = text(dial, 0, 22, '', { size: 18, weight: 600, anchor: 'middle', on: 'sunken', halo: true });
    total.setAttribute('data-part', 'sw-total');
    const legendX = o.operator ? 132 : 76;
    const legends = segments.map((s, i) => {
      if (!s.label) return null;
      const g = el(outer, 'g', { 'data-part': 'sw-legend-' + i });
      const y = -31 + i * 34;
      el(g, 'line', { x1: legendX, y1: y, x2: legendX + 20, y2: y, class: strokeClass(s.tone || 'info'), 'stroke-width': 8, 'stroke-linecap': 'round' });
      text(g, legendX + 30, y + 7, s.label, { tone: s.tone || 'info', weight: 700, halo: true });
      return g;
    });
    let armTo = null;
    if (o.operator) armTo = drawFigure(el(outer, 'g', { transform: 'translate(' + pt(OPERATOR_AT) + ')' }), 'info', 'sw');
    const reachDial = (xy, bend) => armTo && armTo([xy[0] - OPERATOR_AT[0], xy[1] - OPERATOR_AT[1]], bend);
    const scales = { click: 1, press: 1 };
    const applyScale = () => dial.setAttribute('transform', 'scale(' + num(scales.click * scales.press) + ')');
    function setKnurls(shift) {
      knurls.forEach((line, i) => {
        const x = KNURL_X[0] - 6 + ((KNURL_X[i] - KNURL_X[0] + 6 + shift) % (3 * KNURL_PITCH));
        attrs(line, { x1: x, x2: x });
      });
    }
    function setCrown(depth) {
      attrs(crown, { y: CROWN_Y + depth });
      attrs(stem, { y: CROWN_Y + 13 + depth, height: 11 - depth });
    }

    // value: where the hand points (0..max). total: the label in the dial, a number (shown with
    // the unit) or text; 0 or empty hides it. flash: 0..1 stop-colour flash. click: 0..1 bounce.
    // rim: the rim's tone (default ink-2), for example 'stop' when the time has run out.
    function set(state) {
      const s = state || {};
      const value = s.value || 0;
      const tip = dialPoint(deg(value), HAND_R);
      attrs(hand, { x2: tip[0], y2: tip[1] });
      let start = 0;
      segments.forEach((seg, i) => {
        const [a, b] = [deg(start), deg(Math.min(value, seg.to))];
        show(arcs[i], b - a > 0.05);
        if (b - a > 0.05) arcs[i].setAttribute('d', arcD(a, b));
        if (legends[i]) show(legends[i], value > start);
        start = seg.to;
      });
      const label = typeof s.total === 'number' ? withUnit(s.total, o.unit) : s.total || '';
      total.textContent = label;
      show(total, Boolean(s.total));
      rim.setAttribute('class', fillClass(s.rim || 'ink-2'));
      attrs(flash, { opacity: clamp01(s.flash || 0) * 0.9 });
      scales.click = bounce(clamp01(s.click || 0));
      applyScale();
    }

    // Winding: the hand grips the crown's end and turns it in a small wrist arc; the knurls turn
    // and the elbow wobbles, settling at the end.
    function wind(p) {
      const q = clamp01(p);
      const swing = Math.sin(Math.PI * q);
      const turn = q * 4 * Math.PI;
      setKnurls((q * 3 * KNURL_PITCH) % KNURL_PITCH);
      setCrown(0);
      scales.press = 1;
      applyScale();
      const a = WRIST_ARC * swing * Math.sin(turn);
      const radius = CROWN_GRIP[0] - CROWN_AXIS[0];
      reachDial([CROWN_AXIS[0] + radius * Math.cos(a), CROWN_AXIS[1] + radius * Math.sin(a)], 0.12 * swing * Math.sin(3 * turn));
    }

    // Pressing: the hand moves from the crown's end onto its top and pushes it down, then the dial
    // clicks with a short bounce. Afterwards the hand rests on the crown.
    function press(p) {
      const q = clamp01(p);
      const onTop = ease.inOut(clamp01(q / 0.3));
      const depth = PRESS_DEPTH * Math.sin(Math.PI * clamp01((q - 0.3) / 0.3));
      setKnurls(0);
      setCrown(depth);
      scales.press = bounce(clamp01((q - 0.45) / 0.5));
      applyScale();
      reachDial([lerp(CROWN_GRIP[0], CROWN_TOP[0], onTop), lerp(CROWN_GRIP[1], CROWN_TOP[1], onTop) + depth], 0);
    }

    set({ value: 0 });
    press(1);
    return { set, wind, press };
  }

  function axis(parent, opts) {
    const o = withDefaults(opts, { ticks: 4, unit: '' });
    const x = (t) => o.x0 + ((t - o.t0) / (o.t1 - o.t0)) * (o.x1 - o.x0);
    const g = el(parent, 'g', { 'data-part': 'axis' });
    el(g, 'line', { x1: o.x0, y1: o.y, x2: o.x1, y2: o.y, class: 'nx-stroke-ink-2', 'stroke-width': 2 });
    const values = Array.isArray(o.ticks) ? o.ticks
      : Array.from({ length: o.ticks + 1 }, (_, i) => o.t0 + ((o.t1 - o.t0) * i) / o.ticks);
    values.forEach((t) => {
      el(g, 'line', { x1: x(t), y1: o.y, x2: x(t), y2: o.y + 8, class: 'nx-stroke-ink-2', 'stroke-width': 2 });
      text(g, x(t), o.y + 30, withUnit(t, o.unit), { size: 18, anchor: 'middle', tone: 'ink-2' });
    });
    return { x };
  }

  function meter(parent, opts) {
    const o = withDefaults(opts, { tone: 'info' });
    const rx = Math.min(6, o.h / 2);
    const g = el(parent, 'g', { 'data-part': 'meter' });
    el(g, 'rect', { x: o.x, y: o.y, width: o.w, height: o.h, rx, class: 'nx-fill-sunken-bg nx-stroke-hairline', 'stroke-width': 1.5 });
    const fill = el(g, 'rect', { x: o.x, y: o.y, width: 0, height: o.h, rx, 'data-part': 'meter-fill' });
    const setTone = (tone) => fill.setAttribute('class', fillClass(tone));
    setTone(o.tone);
    return { set: (p) => attrs(fill, { width: o.w * clamp01(p) }), setTone };
  }

  function stamp(parent, opts) {
    const o = withDefaults(opts, { kind: 'ok', size: 48 });
    const r = o.size / 2;
    const tone = o.kind === 'stop' ? 'stop' : 'ok';
    const g = el(parent, 'g', { 'data-part': 'stamp' });
    el(g, 'circle', { cx: o.x, cy: o.y, r, class: fillClass(tone + '-bg') + ' ' + strokeClass(tone), 'stroke-width': 3 });
    const at = (dx, dy) => pt([o.x + dx * r, o.y + dy * r]);
    const d = tone === 'ok'
      ? 'M' + at(-0.45, 0) + ' L' + at(-0.12, 0.32) + ' L' + at(0.45, -0.35)
      : 'M' + at(-0.35, -0.35) + ' L' + at(0.35, 0.35) + ' M' + at(0.35, -0.35) + ' L' + at(-0.35, 0.35);
    el(g, 'path', { d, fill: 'none', class: strokeClass(tone), 'stroke-width': Math.max(3, o.size / 10), 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    // Pops in with a small overshoot.
    const pop = (p) => g.setAttribute('transform', scaleAbout([o.x, o.y], ease.outBack(p)));
    pop(1);
    return { show: (on) => show(g, on), pop };
  }

  NX.kit = {
    clamp01, lerp, ramp, along, ease,
    svg, el, text, box, arrow, token, bubble, queue, readout, stopwatch, figure, axis, meter, stamp,
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>// Narrated Explainer sound effects: ten cues synthesised with Web Audio oscillators, noise buffers
// and gain envelopes, so they ship as code. Each cue is (audioContext, destination, when), so the
// same code plays live and renders offline. The shared AudioContext is made on the first click.
(function (root) {
  'use strict';

  const NX = root.NarratedExplainer || (root.NarratedExplainer = {});
  const SILENT = 0.0001; // exponential ramps cannot reach 0

  // Attack-then-decay gain envelope into `dest`; returns the gain node to connect sources to.
  function envelope(ac, dest, when, attack, peak, decay) {
    const g = ac.createGain();
    g.gain.setValueAtTime(SILENT, when);
    g.gain.linearRampToValueAtTime(peak, when + attack);
    g.gain.exponentialRampToValueAtTime(SILENT, when + attack + decay);
    g.connect(dest);
    return g;
  }

  // One oscillator gliding from `from` Hz to `to` Hz over the envelope.
  function tone(ac, dest, when, spec) {
    const attack = spec.attack || 0.005;
    const length = attack + spec.decay;
    const osc = ac.createOscillator();
    osc.type = spec.type || 'sine';
    osc.frequency.setValueAtTime(spec.from, when);
    if (spec.to && spec.to !== spec.from) osc.frequency.exponentialRampToValueAtTime(spec.to, when + length);
    osc.connect(envelope(ac, dest, when, attack, spec.peak, spec.decay));
    osc.start(when);
    osc.stop(when + length + 0.02);
  }

  // Deterministic noise (seeded), so offline renders are identical every time. `smooth` in 0..1
  // low-passes it by a one-pole filter while filling the buffer: 0 is white, near 1 is a rumble.
  function noiseBuffer(ac, seconds, smooth) {
    const length = Math.max(1, Math.round(seconds * ac.sampleRate));
    const buffer = ac.createBuffer(1, length, ac.sampleRate);
    const data = buffer.getChannelData(0);
    let seed = 0x2f6b9a1d;
    let last = 0;
    let peak = 0;
    for (let i = 0; i < length; i += 1) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      const white = seed / 2147483648 - 1;
      last = smooth * last + (1 - smooth) * white;
      data[i] = last;
      peak = Math.max(peak, Math.abs(last));
    }
    if (peak > 0) for (let i = 0; i < length; i += 1) data[i] /= peak;
    return buffer;
  }

  function noise(ac, dest, when, spec) {
    const attack = spec.attack || 0.002;
    const length = attack + spec.decay;
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, length + 0.02, spec.smooth || 0);
    src.connect(envelope(ac, dest, when, attack, spec.peak, spec.decay));
    src.start(when);
    src.stop(when + length + 0.02);
  }

  const cues = {
    click(ac, dest, when) {
      noise(ac, dest, when, { decay: 0.02, peak: 0.5 });
      tone(ac, dest, when, { type: 'square', from: 2200, decay: 0.02, peak: 0.08 });
    },
    pop(ac, dest, when) {
      tone(ac, dest, when, { from: 380, to: 920, attack: 0.004, decay: 0.09, peak: 0.45 });
    },
    whoosh(ac, dest, when) {
      noise(ac, dest, when, { smooth: 0.9, attack: 0.18, decay: 0.32, peak: 0.45 });
      tone(ac, dest, when, { from: 180, to: 520, attack: 0.18, decay: 0.3, peak: 0.05 });
    },
    tick(ac, dest, when) {
      tone(ac, dest, when, { from: 1600, attack: 0.001, decay: 0.035, peak: 0.25 });
    },
    ding(ac, dest, when) {

    const voice = createVoice(narration, c);
    const scene = factory(story, NX.kit || {});
    const labels = Object.assign({}, DEFAULT_LABELS, story.labels || {});
    const modes = modeList(story);
    const speeds = (story.timing && story.timing.speeds) || [0.5, 1];
    const uid = 'nx-' + (story.id || 'story') + '-' + (NX.players.length + 1);
    const ui = { soundOn: true, frameRequest: 0, lastCue: 0, captionKey: '', wordSpans: [], word: -1 };

    figure.classList.add('nx');
    figure.setAttribute('tabindex', '-1');
    if (story.lang) figure.setAttribute('lang', story.lang);

    // DOM ------------------------------------------------------------------------------------
    const bar = figure.appendChild(h(doc, 'div', { class: 'nx-bar' }));
    const controls = bar.appendChild(h(doc, 'div', { class: 'nx-controls' }));
    const button = (parent, cls, text, attrs) => {
      const b = parent.appendChild(h(doc, 'button', Object.assign({ type: 'button', class: cls }, attrs || {}), text));
      return b;
    };
    const modeButtons = [];
    if (modes.length > 1) {
      const group = controls.appendChild(h(doc, 'div', { class: 'nx-group', role: 'group', 'aria-label': labels.mode }));
      modes.forEach((m) => {
        const b = button(group, 'nx-mode', m.label || m.id, { 'aria-pressed': 'false' });
        b.addEventListener('click', () => selectMode(m.id));
        modeButtons.push([m.id, b]);
      });
    }
    const playButton = button(controls, 'nx-play', labels.play);
    const restartButton = button(controls, 'nx-restart', labels.restart);
    const prevButton = button(controls, 'nx-prev', labels.prev);
    const nextButton = button(controls, 'nx-next', labels.next);
    const speedGroup = controls.appendChild(h(doc, 'div', { class: 'nx-group', role: 'group', 'aria-label': labels.speed }));
    const speedButtons = speeds.map((v) => {
      const b = button(speedGroup, 'nx-speed', v + '×', { 'aria-pressed': String(v === 1) });
      b.addEventListener('click', () => { c.setSpeed(v); renderControls(c.snapshot()); });
      return [v, b];
    });
    const voiceButton = button(controls, 'nx-voice', labels.voiceOn, { 'aria-pressed': 'true' });
    const voiceName = controls.appendChild(h(doc, 'span', { class: 'nx-voice-name' }, narration ? narration.label || '' : ''));
    if (!narration) { voiceButton.hidden = true; voiceName.hidden = true; }
    const soundButton = button(controls, 'nx-sound', labels.soundOn, { 'aria-pressed': 'true' });
    const transcriptButton = button(controls, 'nx-transcript-toggle', labels.transcript, { 'aria-expanded': 'false', 'aria-controls': uid + '-transcript' });
    const fullscreenButton = button(controls, 'nx-fullscreen', labels.fullscreen);
    if (typeof figure.requestFullscreen !== 'function') fullscreenButton.hidden = true;
    const themeButton = button(controls, 'nx-theme', labels.themeAuto);
    const progress = bar.appendChild(h(doc, 'div', { class: 'nx-progress' }));
    const stage = figure.appendChild(h(doc, 'div', { class: 'nx-stage' }));
    // The figcaption is the figure's last child (HTML content model), so the transcript comes first.
    const transcript = figure.appendChild(h(doc, 'div', { class: 'nx-transcript', id: uid + '-transcript' }));
    transcript.hidden = true;
    const transcriptList = transcript.appendChild(h(doc, 'ol', {}));
    const captionEl = figure.appendChild(h(doc, 'figcaption', { class: 'nx-caption', 'aria-live': 'polite', id: uid + '-caption' }));
    scene.build(stage);

    let markers = [];
    let transcriptItems = [];
    function buildLists() {
      progress.textContent = '';
      transcriptList.textContent = '';
      const list = c.positions();
      markers = list.map((p, i) => {
        const b = button(progress, 'nx-marker nx-marker-' + p.kind, '', { 'aria-label': (i + 1) + ' / ' + list.length + ': ' + p.caption });
        b.addEventListener('click', () => jumpTo(i));
        return b;
      });
      transcriptItems = list.map((p, i) => {
        const li = transcriptList.appendChild(h(doc, 'li', {}));
        const b = button(li, 'nx-transcript-item', p.caption);
        b.addEventListener('click', () => jumpTo(i));
        return b;
      });
    }

    // Audio ----------------------------------------------------------------------------------
    // Called from every user gesture: the shared AudioContext and the Audio element exist only after one.
    function unlock() {
      if (NX.sfx) { NX.sfx.ensure(); NX.sfx.setMuted(!ui.soundOn); }
      voice.unlock();
    }

    function stopClip() { voice.stop(); }

    // Starts the narration and cue of a new arrival or step, once.
    function handleCue() {
      const cue = c.cue;
      if (cue.seq === ui.lastCue) return;
      ui.lastCue = cue.seq;
      stopClip();
      if (cue.clip) voice.play(cue.id, cue.seq);
      if (cue.sfx && ui.soundOn && NX.sfx) NX.sfx.play(cue.sfx);
    }

    // Drawing --------------------------------------------------------------------------------
    function renderCaption(snap) {
      const key = snap.mode + '|' + snap.caption;
      if (key === ui.captionKey) return;
      ui.captionKey = key;
      captionEl.textContent = '';
      ui.wordSpans = snap.caption.split(/\s+/).filter(Boolean).map((word, i) => {
        if (i) captionEl.appendChild(doc.createTextNode(' '));
        return captionEl.appendChild(h(doc, 'span', { class: 'nx-word' }, word));
      });
      ui.word = -1;
      fit();
    }

    function renderWord(index) {
      if (index === ui.word) return;
      if (ui.wordSpans[ui.word]) ui.wordSpans[ui.word].classList.remove('nx-word-on');
      if (ui.wordSpans[index]) ui.wordSpans[index].classList.add('nx-word-on');
      ui.word = index;
    }
    voice.onWord = () => renderWord(voice.word());

    function renderControls(snap) {
      playButton.textContent = snap.playing ? labels.pause : labels.play;
      modeButtons.forEach(([id, b]) => b.setAttribute('aria-pressed', String(id === snap.mode)));
      speedButtons.forEach(([v, b]) => b.setAttribute('aria-pressed', String(v === snap.speed)));
      voiceButton.textContent = snap.voiceOn ? labels.voiceOn : labels.voiceOff;
      voiceButton.setAttribute('aria-pressed', String(snap.voiceOn));
      soundButton.textContent = ui.soundOn ? labels.soundOn : labels.soundOff;
      soundButton.setAttribute('aria-pressed', String(ui.soundOn));
      const current = snap.atRest ? -1 : snap.at.index;
      const exact = snap.at.kind === 'intro' || snap.at.kind === 'moment';
      markers.forEach((b, i) => {
        b.classList.toggle('nx-passed', i <= current);
        if (exact && i === current) b.setAttribute('aria-current', 'step');
        else b.removeAttribute('aria-current');
      });
      transcriptItems.forEach((b, i) => {
        if (exact && i === current) b.setAttribute('aria-current', 'step');
        else b.removeAttribute('aria-current');
      });
    }

    // Draws `snap` (live or a tool frame) with its controls, caption and highlighted word.
    function render(snap, motion, sfx, word) {
      scene.draw(scene.stateAt(snap.mode, snap.t), {
        mode: snap.mode, t: snap.t, at: snap.at, playing: snap.playing, reduced: snap.reduced, motion, sfx,
      });
      renderCaption(snap);
      renderControls(snap);
      renderWord(word);
    }

    function renderLive(now) {
      render(c.snapshot(), (ms) => c.motion(now, ms), (name) => {
        if (ui.soundOn && NX.sfx && c.sfxOnce(name)) NX.sfx.play(name);
      }, voice.word());
    }

    // Playback loop: animation frames only while playing.
    function frame(now) {
      ui.frameRequest = 0;
      c.tick(now);
      handleCue();
      renderLive(now);
      if (c.snapshot().playing) ui.frameRequest = root.requestAnimationFrame(frame);
    }

    function loop() {
      if (!ui.frameRequest && c.snapshot().playing) ui.frameRequest = root.requestAnimationFrame(frame);
    }

    const clock = () => root.performance.now();

    function update() {
      handleCue();
      renderLive(clock());
      loop();
    }

    // Actions ----------------------------------------------------------------------------------
    function togglePlay() {
      unlock();
      if (c.snapshot().playing) { c.pause(clock()); stopClip(); } else c.play(clock());
      update();
    }
    function restart() { unlock(); stopClip(); c.restart(clock()); update(); }
    function step(direction) { unlock(); stopClip(); c.step(direction, clock()); update(); }
    function jumpTo(index) { unlock(); stopClip(); c.jump(index, clock()); update(); }
    function selectMode(id) {
      unlock();
      if (id === c.snapshot().mode) return; // the controller ignores it; keep the clip playing
      stopClip();
      c.setMode(id, clock());
      buildLists();
      update();
    }
    function toggleVoice() {
      unlock();
      c.setVoice(!c.snapshot().voiceOn);
      if (!c.snapshot().voiceOn) stopClip();
      renderControls(c.snapshot());
    }
    function toggleSound() {
      ui.soundOn = !ui.soundOn;
      unlock();
      renderControls(c.snapshot());
    }
    function toggleTranscript() {
      transcript.hidden = !transcript.hidden;
      transcriptButton.setAttribute('aria-expanded', String(!transcript.hidden));
      fit();
    }
    // Theme: Auto follows the operating system; a choice is remembered when storage allows it.
    const themed = doc.body && doc.body.classList.contains('nx') ? [figure, doc.body] : [figure];
    function applyTheme(theme) {
      ui.theme = theme;
      themed.forEach((el) => {
        if (theme === 'auto') el.removeAttribute('data-nx-theme');
        else el.setAttribute('data-nx-theme', theme);
      });
      themeButton.textContent = labels['theme' + theme[0].toUpperCase() + theme.slice(1)];
    }
    function cycleTheme() {
      applyTheme(THEMES[(THEMES.indexOf(ui.theme) + 1) % THEMES.length]);
      try { root.localStorage.setItem(THEME_KEY, ui.theme); } catch (error) { /* playback does not need storage */ }
    }
    let storedTheme = null;
    try { storedTheme = root.localStorage.getItem(THEME_KEY); } catch (error) { /* no storage: Auto */ }
    applyTheme(THEMES.indexOf(storedTheme) === -1 ? 'auto' : storedTheme);

    // Fit: the stage keeps its aspect ratio and narrows until everything above and below it fits the
    // window height. A standalone page in a landscape window fits from the page top, so the first
    // view shows title through caption; otherwise it fits with the figure's top at the window's top.
    // It is measured without changing the layout, so a reader's scroll position never moves: the
    // space below the stage runs from the caption, so the transcript between them never counts and
    // opening it does not shrink the stage. It never narrows below MIN_STAGE px or its natural width.
    const standalone = Boolean(doc.body && doc.body.classList.contains('nx-page'));
    function fit() {
      if (!root.innerHeight || typeof stage.getBoundingClientRect !== 'function' || typeof root.getComputedStyle !== 'function') return;
      const box = stage.getBoundingClientRect();
      const outer = figure.getBoundingClientRect();
      if (!box.width || !box.height) return;
      const px = (el, property) => parseFloat(root.getComputedStyle(el)[property]) || 0;
      const natural = figure.clientWidth - px(figure, 'paddingLeft') - px(figure, 'paddingRight');
      const gap = Math.max(px(stage, 'marginBottom'), px(captionEl, 'marginTop'));
      const below = outer.bottom - captionEl.getBoundingClientRect().top + gap;
      const fromPageTop = standalone && root.innerWidth >= root.innerHeight;
      const above = fromPageTop ? box.top + (root.scrollY || 0) : box.top - outer.top;
      const fitted = Math.floor((root.innerHeight - above - below) * box.width / box.height);
      stage.style.maxWidth = Math.max(Math.min(MIN_STAGE, natural), fitted) + 'px';
    }
    if (typeof root.addEventListener === 'function') root.addEventListener('resize', fit);

    function toggleFullscreen() {
      if (doc.fullscreenElement === figure) doc.exitFullscreen();
      else if (typeof figure.requestFullscreen === 'function') figure.requestFullscreen();
    }

    playButton.addEventListener('click', togglePlay);
    restartButton.addEventListener('click', restart);
    prevButton.addEventListener('click', () => step(-1));
    nextButton.addEventListener('click', () => step(1));
    voiceButton.addEventListener('click', toggleVoice);
    soundButton.addEventListener('click', toggleSound);
    transcriptButton.addEventListener('click', toggleTranscript);
    fullscreenButton.addEventListener('click', toggleFullscreen);
    themeButton.addEventListener('click', cycleTheme);
    if (reducedQuery && reducedQuery.addEventListener) {
      reducedQuery.addEventListener('change', () => { c.setReduced(reducedQuery.matches); renderLive(clock()); });
    }

    const KEY_HANDLERS = {
      toggle: togglePlay, prev: () => step(-1), next: () => step(1), restart, voice: () => { if (narration) toggleVoice(); },
      sound: toggleSound, transcript: toggleTranscript, fullscreen: toggleFullscreen,
    };

    function onKey(event) {
      if (event.defaultPrevented || isTypingTarget(event.target)) return;
      const action = keyAction(event);
      if (!action) return;
      // Space on a focused button already clicks it.
      if (action === 'toggle' && event.key === ' ' && event.target && event.target.tagName === 'BUTTON') return;
      if (action.slice(0, 5) === 'mode:') {
        const m = modes[Number(action.slice(5))];
        if (!m || modes.length < 2) return;
        selectMode(m.id);
      } else {
        KEY_HANDLERS[action]();
      }
      event.preventDefault();
    }
    figure.addEventListener('keydown', onKey);
    installDocumentKeys(doc);

    // Tool API -------------------------------------------------------------------------------
    // Stops playback silently and shows `mode`'s markers and transcript, for goto and renderAt.
    function showMode(mode) {
      c.pause(clock());
      stopClip();
      if (ui.frameRequest) { root.cancelAnimationFrame(ui.frameRequest); ui.frameRequest = 0; }
      c.setMode(mode, clock());
      buildLists();
    }

    const player = {
      figure,
      story,
      _onKey: onKey,
      positions: (mode) => c.positions(mode),
      goto(mode, index) {
        showMode(mode);
        c.jump(index, clock());
        ui.lastCue = c.cue.seq; // draw only: no narration, no cue
        renderLive(clock());
      },
      plan: (mode) => c.plan(mode),
      renderAt(mode, ms) {
        showMode(mode);
        const f = c.renderAt(mode, ms);
        const words = f.clipTime === null ? null : (clips[f.at.id] || {}).words;
        render(f, f.motion, () => {}, words ? wordIndexAt(words, f.clipTime) : -1);
      },
      soundtrack: (mode) => renderSoundtrack(c.plan(mode), clips, NX.sfx),
    };

    buildLists();
    renderLive(clock());
    NX.players.push(player);
    return player;
  }

  NX.scene = function (factory) { NX._scene = factory; };
  NX.mount = mount;
  NX._createController = createController;
  NX._wordIndexAt = wordIndexAt;
  NX._keyAction = keyAction;
})(globalThis);
</script>
<script>// Deadline race: an App gives a request 300 ms. The request waits in a busy Gateway's queue, then
// fans out to Services A and B. Before, each service gets a fixed 200 ms timeout, so the App gives
// up at 300 ms and A's reply is lost. After, the Gateway passes the deadline on: each service gets
// the 100 ms left minus a 20 ms reserve, B times out at 280 ms and the answer arrives at 296 ms.
// Two views share one pure model: a system view with a stopwatch intro, and a timeline.
NarratedExplainer.scene(function (story, kit) {
  const DEADLINE = 300; // the App's stopwatch: budget plus buffer
  const BUDGET = 200; // the time the Gateway may spend on its own work
  const QUEUE_END = 200; // the request leaves the queue and fans out
  const BUDGET_AT = 201; // the moment that explains each service's timeout
  const A_ANSWER = 220;
  const A_TRAVEL = 10; // A's reply climbs to the Gateway row, 220..230
  const RESERVE = 20;
  const BUILD = 10; // the Gateway builds the answer after B times out
  const CARRY = 6; // and carries it back to the App
  const END = 320;
  const AHEAD_LEAVE_AT = [50, 100, 150];

  // ---- The model ----

  const countdownAt = (t) => Math.max(0, Math.ceil(DEADLINE - t));
  const serviceBudgetFor = (mode) => (mode === 'after' ? Math.min(countdownAt(QUEUE_END), BUDGET) - RESERVE : BUDGET);

  function aStatusAt(t, stopped, received) {
    if (received) return 'used';
    if (stopped) return 'lost';
    if (t >= A_ANSWER) return 'waiting';
    return t >= QUEUE_END ? 'asked' : 'idle';
  }

  const label = (bubble, timing, tone) => ({ bubble, timing, tone });

  // The speech bubble and answer timing on each fan-out line; null where nothing shows.
  function lineLabelsOf(s) {
    if (!s.fanOut) return { a: label(null, null, null), b: label(null, null, null) };
    const ask = 'You have ' + s.serviceBudget + ' ms to answer. Hurry!';
    const a = s.t >= A_ANSWER ? label(null, 'Answered in ' + (A_ANSWER - QUEUE_END) + ' ms ✓', 'ok') : label(ask, null, null);
    let b = label(ask, 'Waiting… ' + Math.floor(s.t - QUEUE_END) + ' ms', 'ink');
    if (s.bLine === 'timed-out') b = label(null, 'No answer in ' + s.serviceBudget + ' ms: timed out', 'ink-2');
    if (s.callStatus === 'cancelled') b = label(null, 'No answer after ' + (DEADLINE - QUEUE_END) + ' ms. Call cancelled.', 'stop');
    return { a, b };
  }

  function stateAt(mode, storyT) {
    const t = Math.min(END, Math.max(0, storyT));
    const after = mode === 'after';
    const budget = serviceBudgetFor(mode);
    const bTimerEnd = QUEUE_END + budget;
    const answerBuilt = bTimerEnd + BUILD;
    const arrival = answerBuilt + CARRY;
    const fanOut = t >= QUEUE_END;
    const stopped = !after && t >= DEADLINE;
    const received = after && t >= arrival;
    const bTimedOut = after && t >= bTimerEnd;
    let answerAt = 'none';
    if (after && t >= answerBuilt) answerAt = t < arrival ? 'call' : 'app';
    const s = {
      mode,
      t,
      countdown: countdownAt(t),
      hand: received ? DEADLINE - arrival : Math.max(0, DEADLINE - t),
      readout: received ? 'Answered with ' + (DEADLINE - arrival) + ' ms to spare' : 'Time left: ' + countdownAt(t) + ' ms',
      queueFill: kit.ramp(t, 0, QUEUE_END),
      ahead: AHEAD_LEAVE_AT.filter((leaveAt) => t < leaveAt).length,
      requestAt: fanOut ? 'work' : 'queue',
      fanOut,
      budgetShown: t >= BUDGET_AT,
      serviceBudget: budget,
      bStatus: bTimedOut ? 'timed-out' : fanOut ? 'waiting' : 'idle',
      bLine: bTimedOut ? 'timed-out' : 'open',
      bBarEnd: fanOut ? Math.min(t, after ? bTimerEnd : DEADLINE) : QUEUE_END,
      aStatus: aStatusAt(t, stopped, received),
      aLift: kit.ramp(t, A_ANSWER, A_ANSWER + A_TRAVEL),
      appStatus: received ? 'received' : stopped ? 'stopped' : 'waiting',
      callStatus: stopped ? 'cancelled' : 'open',
      answerAt,
      answerBuild: after ? kit.ramp(t, bTimerEnd, answerBuilt) : 0,
      answerLift: after ? kit.ramp(t, answerBuilt, arrival) : 0,
    };
    s.lineLabels = lineLabelsOf(s);
    return s;
  }

  // ---- Geometry (viewBox units) ----

  const QUEUE_Y = 318;
  const SLOT_W = 40;
  const SLOT_GAP = 6;
  const slotX = (fromBack) => 450 + SLOT_W / 2 + (SLOT_W + SLOT_GAP) * fromBack; // four queue slots; slot 3 is the front
  const WORK = { x: 642, y: 260, w: 148, h: 116 }; // the "Working on it" area, right of the queue
  const UPRIGHT = -90; // our request stands upright in a queue slot and lies flat everywhere else
  const APP_SPOT = [145, 300];
  const REQUEST_START = [355, 300]; // at the press the request waits on the call, between the App and the Gateway
  const WORK_REQUEST = [706, 300];
  const WORK_REPLY = [716, 350];
  // The fan-out lines meet each service below its name, so tokens arrive without crossing it.
  const SERVICE_A = [1065, 230];
  const SERVICE_B = [1065, 390];
  const LINE_A = [[800, 260], [960, 230]];
  const LINE_B = [[800, 340], [960, 390]];
  // Token trips drawn inside the hold of the moment that starts them; story time stands still.
  const TRIP_MS = 1100;
  const TRIPS = {
    send: { request: [REQUEST_START, [430, 300], [slotX(0), QUEUE_Y]] },
    'fan-out': {
      request: [[slotX(3), QUEUE_Y], WORK_REQUEST],
      // The asks set off a little way along their lines, clear of "Working on it".
      reqA: [kit.along(LINE_A, 0.2), LINE_A[1], SERVICE_A],
      reqB: [kit.along(LINE_B, 0.2), LINE_B[1], SERVICE_B],
    },
    // A's reply comes down the Gateway's edge, beside our request rather than across it.
    'a-answers': { reply: [SERVICE_A, LINE_A[1], LINE_A[0], [800, WORK_REPLY[1]], WORK_REPLY] },
  };
  const SEND_TURN_FROM = 0.6; // on the send trip our request turns upright once inside the Gateway
  // The answer travels by story time, 290..296, so it reaches the App as its status turns. It runs
  // along the bottom of the Gateway and climbs to the call left of our request, right of "call".
  const ANSWER_PATH = [WORK_REPLY, [520, WORK_REPLY[1]], [505, 300], [355, 300], APP_SPOT];
  const WIND = { 'intro-budget': [0, BUDGET], 'intro-buffer': [BUDGET, DEADLINE] };
  const WIND_MS = 2000;
  const PRESS_MS = 600;

  const xOf = (t) => 260 + 2.2 * t;
  const ROW_2 = 268; // the Gateway's second timeline row, where A's reply waits
  const ANSWER_RIGHT = 916; // the answer grows leftward out of the 280..300 slot
  const ANSWER_SLOT = 40;
  const ANSWER_FULL = 340;
  const ANSWER_RISE = ROW_2 - 120; // up to the App lane
  // A's reply waits right of the fan-out arrows and left of the deadline line.
  const REPLY_CHIP = { x: 724, w: 192 };

  const APP_TEXT = {
    waiting: ['waiting', 'ink-2'],
    stopped: ['✕ stopped waiting, no answer', 'stop'],
    received: ['✓ answer received in time', 'ok'],
  };
  const SYS_APP_TEXT = {
    waiting: ['waiting', 'ink-2'],
    stopped: ['✕ gave up', 'stop'],
    received: ["✓ got A's reply", 'ok'],
  };

  const round = (v) => Math.round(v * 100) / 100;
  const show = (node, on) => node.setAttribute('visibility', on ? 'visible' : 'hidden');
  const haloText = (svg, x, y, str, opts) => kit.text(svg, x, y, str, Object.assign({ size: 18, halo: true }, opts));

  let p; // system view handles
  let q; // timeline handles

  function buildSystem(stage) {
    const svg = kit.svg(stage, '0 0 1200 460', 'System view: the App, the Gateway and Services A and B');
    const systemNode = (tag, attrs) => kit.el(svg, tag, attrs);
    p = {
      watch: kit.stopwatch(svg, {
        cx: 130, cy: 112, r: 56, max: DEADLINE, unit: 'ms', operator: true,
        segments: [{ to: BUDGET, tone: 'info', label: 'budget 200 ms' }, { to: DEADLINE, tone: 'warn', label: 'buffer +100 ms' }],
      }),
      readout: kit.readout(svg, { x: 1185, y: 118, anchor: 'end' }),
      app: kit.box(svg, { x: 10, y: 240, w: 270, h: 120, label: 'App' }),
      gateway: kit.box(svg, { x: 430, y: 180, w: 370, h: 240, label: 'Gateway' }),
      serviceA: kit.box(svg, { x: 960, y: 170, w: 210, h: 80, label: 'Service A' }),
      serviceB: kit.box(svg, { x: 960, y: 330, w: 210, h: 80, label: 'Service B' }),
      queue: kit.queue(svg, { x: 450, y: 260, slots: 4, slotW: SLOT_W, gap: SLOT_GAP, h: 116, title: 'Queue' }),
    };
    systemNode('rect', { x: WORK.x, y: WORK.y, width: WORK.w, height: WORK.h, rx: 6, fill: 'none', class: 'nx-stroke-edge', 'stroke-width': 2, 'stroke-dasharray': '8 6' });
    kit.text(svg, WORK.x, WORK.y - 12, 'Working on it', { size: 18, tone: 'ink-2' });
    kit.text(svg, 615, 446, 'Grey: other requests ahead in line', { size: 18, anchor: 'middle', tone: 'ink-2' });
    p.calls = [295, 305].map((y) => kit.arrow(svg, { from: [280, y], to: [430, y], head: false }));
    haloText(svg, 355, 332, 'call', { anchor: 'middle', tone: 'ink-2' });
    p.cancel = haloText(svg, 424, 230, '✕ cancelled at 300 ms', { anchor: 'end', weight: 600, tone: 'stop' });
    p.lineA = kit.arrow(svg, { from: LINE_A[0], to: LINE_A[1], head: false });
    p.fanOut = haloText(svg, 806, 196, 'Fan-out', {});
    p.lineB = kit.arrow(svg, { from: LINE_B[0], to: LINE_B[1], head: false });
    p.bTimedOut = haloText(svg, 880, 400, 'timed out', { anchor: 'middle', weight: 700, tone: 'ink-2' });
    p.bubbles = {
      a: kit.bubble(svg, { x: 705, y: 132, w: 350, h: 34, tail: [905, 196] }),
      b: kit.bubble(svg, { x: 836, y: 280, w: 350, h: 34, tail: [880, 338] }),
    };
    p.timings = {
      a: kit.readout(svg, { x: 880, y: 155, size: 18, anchor: 'middle' }),
      b: kit.readout(svg, { x: 806, y: 440, size: 18 }),
    };
    // Our request turns upright to fit a queue slot, so it is drawn here rather than as a kit token.
    p.request = systemNode('g', { 'data-part': 'our-request' });
    kit.el(p.request, 'rect', { x: -55, y: -17, width: 110, height: 34, rx: 6, class: 'nx-fill-info-fg' });
    kit.text(p.request, 0, 6, 'Our request', { size: 18, weight: 600, anchor: 'middle', on: 'info' });
    p.reqA = kit.token(svg, { label: 'request', tone: 'info' });
    p.reqB = kit.token(svg, { label: 'request', tone: 'info' });
    p.reply = kit.token(svg, { label: 'reply', tone: 'info' });
    p.answer = kit.token(svg, { label: "A's reply + B timed out", tone: 'ok' });
  }

  function buildTimeline(stage) {
    const svg = kit.svg(stage, '0 0 1200 600', 'Timeline: what each part does from 0 to 400 ms');
    const timelineNode = (parent, tag, attrs) => kit.el(parent, tag, attrs);
    kit.text(svg, 20, 30, 'In this example both services get the same timeout.', { size: 18, tone: 'ink-2' });
    [['App', 'waits until 300 ms', 128], ['Gateway', '', 248], ['Service A', 'answers after 20 ms', 368],
      ['Service B', 'never answers', 468]].forEach(([name, note, y]) => {
      kit.text(svg, 20, y, name, { size: 22, weight: 600 });
      if (note) kit.text(svg, 20, y + 26, note, { size: 18, tone: 'ink-2' });
    });
    kit.axis(svg, { x0: xOf(0), x1: xOf(400), y: 550, t0: 0, t1: 400, ticks: 4, unit: 'ms' });
    // The deadline and the playhead lie under everything else, so haloed labels stay readable over them.
    timelineNode(svg, 'line', { x1: xOf(DEADLINE), y1: 76, x2: xOf(DEADLINE), y2: 550, class: 'nx-stroke-stop', 'stroke-width': 3 });
    haloText(svg, xOf(DEADLINE), 68, 'Deadline · 300 ms', { anchor: 'middle', weight: 600, tone: 'stop' });
    const playhead = timelineNode(svg, 'line', { x1: xOf(0), y1: 76, x2: xOf(0), y2: 550, class: 'nx-stroke-ink', 'stroke-width': 2, 'data-part': 'playhead' });
    q = { playhead, queue: kit.meter(svg, { x: xOf(0), y: 206, w: xOf(QUEUE_END) - xOf(0), h: 36, tone: 'warn-bg' }) };
    // Left-aligned in the queue bar, so the answer rising through this lane at 290..296 passes clear.
    haloText(svg, xOf(0) + 12, 230, 'Waiting in queue (Gateway busy)', {});
    q.reserve = timelineNode(svg, 'g', { 'data-part': 'reserve' });
    timelineNode(q.reserve, 'rect', { x: xOf(DEADLINE - RESERVE), y: 206, width: 2.2 * RESERVE, height: 36, class: 'nx-fill-ok-bg nx-stroke-ok', 'stroke-width': 2 });
    haloText(q.reserve, xOf(DEADLINE) + 8, 230, '20 ms reserve', { weight: 600, tone: 'ok' });
    q.bBar = timelineNode(svg, 'rect', { x: xOf(QUEUE_END), y: 448, width: 0, height: 24, class: 'nx-fill-ink-2-fg' });
    // B's planned 200 ms, hatched past the deadline.
    q.bPlan = timelineNode(svg, 'g', { 'data-part': 'b-plan' });
    timelineNode(q.bPlan, 'rect', { x: xOf(DEADLINE), y: 448, width: 2.2 * 100, height: 24, fill: 'none', class: 'nx-stroke-ink-2', 'stroke-width': 2, 'stroke-dasharray': '8 6' });
    for (let x = xOf(DEADLINE) + 6; x + 24 <= xOf(400); x += 12) {
      timelineNode(q.bPlan, 'line', { x1: x, y1: 472, x2: x + 24, y2: 448, class: 'nx-stroke-ink-2', 'stroke-width': 2, opacity: 0.5 });
    }
    haloText(q.bPlan, xOf(400), 506, "B's timeout: full 200 ms, would end at 400 ms", { anchor: 'end' });
    q.bShort = haloText(svg, xOf(QUEUE_END), 506, "B's timeout: 80 ms", {});
    q.fanOut = [[[694, 244], [680, 356]], [[706, 244], [722, 446]]].map(([from, to]) => kit.arrow(svg, { from, to }));
    q.fanOutLabel = haloText(svg, 668, 314, 'Fan-out · 100 ms left', { anchor: 'end' });
    q.app = kit.readout(svg, { x: xOf(DEADLINE) + 8, y: 126, size: 18 });
    q.bTimedOut = kit.token(svg, { label: 'timed out', tone: 'stop' });
    q.bTimedOut.moveTo([824, 426]);
    q.aReply = kit.token(svg, { label: "A's reply", tone: 'info' });
    // Waiting in the Gateway row, A's reply is narrower than a kit token would make it.
    q.replyChip = timelineNode(svg, 'g', { 'data-part': 'reply-chip' });
    q.replyChipBox = timelineNode(q.replyChip, 'rect', { x: REPLY_CHIP.x, y: ROW_2 - 17, width: REPLY_CHIP.w, height: 34, rx: 8 });
    q.replyChipLabel = kit.text(q.replyChip, REPLY_CHIP.x + REPLY_CHIP.w / 2, ROW_2 + 6, '', { size: 18, weight: 600, anchor: 'middle', on: 'info' });
    q.answer = timelineNode(svg, 'g', { 'data-part': 'answer' });
    q.answerBox = timelineNode(q.answer, 'rect', { x: ANSWER_RIGHT - ANSWER_SLOT, y: ROW_2 - 18, width: ANSWER_SLOT, height: 36, rx: 6, class: 'nx-fill-ok-fg' });
    // The label grows with the box, scaled about the box's middle.
    q.answerLabelGroup = timelineNode(q.answer, 'g', {});
    q.answerLabel = kit.text(q.answerLabelGroup, 0, 6, "One answer: A's reply + B timed out", { size: 18, weight: 600, anchor: 'middle', on: 'ok' });
  }

  // The stopwatch: wound in the first two intro steps, pressed in the third, then counting down.
  // The press runs early in its hold, so it lands with the click story.json cues on arrival.
  function drawStopwatch(s, ctx) {
    const w = p.watch;
    if (ctx.at.kind === 'intro') {
      const windRange = WIND[ctx.at.id];
      if (windRange) {
        const m = ctx.motion(WIND_MS);
        const e = kit.ease.inOut(m);
        w.wind(m);
        w.set({ value: kit.lerp(windRange[0], windRange[1], e), total: e >= 0.5 ? windRange[1] : windRange[0] });
      } else {
        w.press(ctx.motion(PRESS_MS));
        w.set({ value: DEADLINE, total: DEADLINE });
      }
      return;
    }
    const flash = ctx.at.kind === 'moment' && ctx.at.id === 'deadline-passes' ? 1 - ctx.motion(700) : 0;
    const zero = s.countdown === 0 && s.appStatus !== 'received';
    w.press(1);
    w.set({ value: s.hand, total: DEADLINE, flash, rim: zero ? 'stop' : 'ink-2' });
  }

  function drawSystem(s, ctx, holdMotion) {
    const intro = ctx.at.kind === 'intro';
    const readoutTone = s.appStatus === 'received' ? 'ok' : s.countdown === 0 ? 'stop' : 'ink';
    p.readout.set(intro ? '' : s.readout, readoutTone);
    p.app.setStatus(SYS_APP_TEXT[s.appStatus][0], SYS_APP_TEXT[s.appStatus][1]);
    const cancelled = s.callStatus === 'cancelled';
    p.calls.forEach((line) => line.setTone(cancelled ? 'stop' : 'ink'));
    show(p.cancel, cancelled);
    p.queue.set([0, 1, 2, 3].map((slot) => (slot >= 4 - s.ahead ? { label: '', tone: 'edge' } : null)));

    const reach = s.fanOut ? holdMotion('fan-out', 500) : 0;
    p.lineA.draw(reach);
    show(p.fanOut, s.fanOut);
    p.lineB.draw(reach);
    const bTimedOut = s.bLine === 'timed-out';
    p.lineB.setDashed(bTimedOut);
    p.lineB.setTone(bTimedOut ? 'ink-2' : 'ink');
    show(p.bTimedOut, bTimedOut);

    ['a', 'b'].forEach((key) => {
      const l = s.lineLabels[key];
      p.bubbles[key].show(l.bubble !== null);
      p.bubbles[key].setText(l.bubble || '');
      p.bubbles[key].pop(holdMotion('fan-out', 450));
      p.timings[key].set(l.timing || '', l.tone || 'ink');
    });
  }

  // The request, the asks, A's reply and the answer: where the state puts them, or on a trip
  // during the hold of the moment that moves them.
  function drawTokens(s, ctx) {
    const intro = ctx.at.kind === 'intro';
    const lost = s.aStatus === 'lost';
    const at = {
      request: intro ? REQUEST_START : s.requestAt === 'work' ? WORK_REQUEST : [slotX(3 - s.ahead), QUEUE_Y],
      reqA: SERVICE_A,
      reqB: SERVICE_B,
      reply: WORK_REPLY,
      answer: s.answerAt === 'app' ? APP_SPOT : kit.along(ANSWER_PATH, s.answerLift),
    };
    let requestTurn = !intro && s.requestAt === 'queue' ? UPRIGHT : 0;
    const trip = ctx.at.kind === 'moment' ? TRIPS[ctx.at.id] : null;
    if (trip) {
      const e = kit.ease.inOut(ctx.motion(TRIP_MS));
      Object.keys(trip).forEach((name) => { at[name] = kit.along(trip[name], e); });
      if (ctx.at.id === 'send') requestTurn = UPRIGHT * kit.ramp(e, SEND_TURN_FROM, 1);
      if (ctx.at.id === 'fan-out') requestTurn = UPRIGHT * (1 - e);
    }
    show(p.request, !intro || ctx.at.id === 'intro-start');
    p.request.setAttribute('transform', 'translate(' + round(at.request[0]) + ' ' + round(at.request[1]) + ') rotate(' + round(requestTurn) + ')');
    p.reqA.show(s.aStatus === 'asked');
    p.reqA.moveTo(at.reqA);
    p.reqB.show(s.fanOut && s.bLine === 'open');
    p.reqB.moveTo(at.reqB);
    p.reply.show((s.aStatus === 'waiting' && s.answerAt === 'none') || lost);
    p.reply.setTone(lost ? 'stop' : 'info');
    p.reply.moveTo(at.reply);
    p.answer.show(s.answerAt !== 'none');
    p.answer.moveTo(at.answer);
  }

  function drawTimeline(s, ctx, holdMotion) {
    const after = s.mode === 'after';
    show(q.playhead, ctx.at.kind !== 'rest');
    q.playhead.setAttribute('x1', round(xOf(s.t)));
    q.playhead.setAttribute('x2', round(xOf(s.t)));
    q.queue.set(s.queueFill);
    q.fanOut.forEach((arrow) => arrow.draw(s.fanOut ? holdMotion('fan-out', 500) : 0));
    show(q.fanOutLabel, s.fanOut);

    // Each service's timeout appears at the moment that explains it.
    show(q.reserve, after && s.budgetShown);
    q.reserve.setAttribute('opacity', round(holdMotion('after-budget', 500)));
    show(q.bPlan, !after && s.budgetShown);
    q.bPlan.setAttribute('opacity', round(holdMotion('before-budget', 500)));
    show(q.bShort, after && s.budgetShown);
    show(q.bBar, s.fanOut);
    q.bBar.setAttribute('width', round(2.2 * (s.bBarEnd - QUEUE_END)));
    q.bTimedOut.show(s.bStatus === 'timed-out');

    // A's reply climbs to the Gateway row and waits there, or is lost; after, the answer replaces it.
    const answering = after && s.bStatus === 'timed-out';
    const climbing = s.aStatus === 'waiting' && s.aLift < 1;
    const lost = s.aStatus === 'lost';
    q.aReply.moveTo([803, kit.lerp(360, ROW_2, s.aLift)]);
    q.aReply.show(climbing);
    q.replyChipLabel.textContent = lost ? "A's reply lost" : "A's reply waits for B";
    q.replyChipBox.setAttribute('class', lost ? 'nx-fill-stop-fg' : 'nx-fill-info-fg');
    show(q.replyChip, (s.aStatus === 'waiting' && !climbing && !answering) || lost);

    show(q.answer, answering);
    const width = ANSWER_SLOT + (ANSWER_FULL - ANSWER_SLOT) * s.answerBuild;
    q.answerBox.setAttribute('x', round(ANSWER_RIGHT - width));
    q.answerBox.setAttribute('width', round(width));
    q.answerLabelGroup.setAttribute('transform', 'translate(' + round(ANSWER_RIGHT - width / 2) + ' ' + ROW_2 + ') scale(' + round(width / ANSWER_FULL) + ')');
    q.answerLabel.setAttribute('opacity', round(s.answerBuild));
    q.answer.setAttribute('transform', 'translate(0 ' + round(-ANSWER_RISE * s.answerLift) + ')');
    q.app.set(APP_TEXT[s.appStatus][0], APP_TEXT[s.appStatus][1]);
  }

  return {
    stateAt,
    build(stage) {
      buildSystem(stage);
      buildTimeline(stage);
    },
    draw(s, ctx) {
      // Motion 0..1 inside the hold of moment id; 1 anywhere else, so every position ends in its final pose.
      const holdMotion = (id, ms) => (ctx.at.kind === 'moment' && ctx.at.id === id ? ctx.motion(ms) : 1);
      drawStopwatch(s, ctx);
      drawSystem(s, ctx, holdMotion);
      drawTokens(s, ctx);
      drawTimeline(s, ctx, holdMotion);
    },
  };
});
</script><script>NarratedExplainer.mount(document.querySelector('figure.nx'), {story: JSON.parse(document.getElementById("nx-story").textContent),narration: JSON.parse(document.getElementById("nx-narration").textContent)});</script><footer><a href="https://github.com/ohade/narrated-explainer">Made with Narrated Explainer</a></footer></body></html>
